[binaries]
c = '/usr/bin/gcc'
cpp = '/usr/bin/g++'
llvm-config = '/workspace/sysroot/usr/bin/llvm-config-19'
[built-in options]
c_args = ['-I/workspace/sysroot/usr/include', '-I/workspace/sysroot/usr/include/x86_64-linux-gnu']
cpp_args = ['-I/workspace/sysroot/usr/include', '-I/workspace/sysroot/usr/include/x86_64-linux-gnu']
c_link_args = ['-L/workspace/sysroot/usr/lib/x86_64-linux-gnu']
cpp_link_args = ['-L/workspace/sysroot/usr/lib/x86_64-linux-gnu']
pkg_config_path = ['/workspace/sysroot/usr/lib/x86_64-linux-gnu/pkgconfig', '/workspace/sysroot/usr/share/pkgconfig']
